name: HH.uz Data Jobs Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Agar oldingi ishga tushirish hali tugamagan bo'lsa, ustma-ust
# ishlab ketmasligi uchun
concurrency:
  group: hh-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'ni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Kutubxonalarni o'rnatish
        run: pip install -r requirements.txt

      - name: Botni ishga tushirish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HH_AREA_ID: ${{ vars.HH_AREA_ID }}
        run: python hh_monitor.py

      - name: seen_vacancies.json o'zgarishini saqlab qo'yish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_vacancies.json
          git diff --cached --quiet || git commit -m "chore: update seen vacancies [skip ci]"
          git push
